  #go:active { transform: translateY(5px); box-shadow: 0 3px 0 #0003; }
  .conf { position: fixed; top: -12vh; z-index: 4; font-size: 2.6rem; pointer-events: none; animation: fall 3.2s linear forwards; }

<script type="module">
import * as THREE from '../lib/three.module.min.js';

// ---------- sounds, voice & music ----------
let ac, musicOut, voiceSrc;
const voices = {}, MUSIC_VOL = 0.35;
function tone(f, at, dur, type = 'triangle', vol = 0.2, out = ac?.destination) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur);
}
const ding = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.07, 0.3));
const sparkle = () => [1568, 2093, 2637].forEach((f, i) => tone(f, i * 0.05, 0.25, 'sine', 0.08));
const whistle = () => { tone(2000, 0, 0.12, 'square', 0.06); tone(2000, 0.18, 0.3, 'square', 0.06); };
const poof = () => tone(300, 0, 0.2, 'sine', 0.2);
const fanfare = () => [523, 523, 523, 659, 784, 0, 659, 1047].forEach((f, i) => f && tone(f, i * 0.14, 0.4));

// Voice lines are recorded ahead of time (python3 tools/voice.py) and embedded in #voice-data, so they work offline.
function speak(key) {
  const buf = voices[key];
  if (!buf) return;
  voiceSrc?.stop();
  const src = voiceSrc = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
  musicOut.gain.setTargetAtTime(0, ac.currentTime, 0.05);  // music pauses while the voice talks
  src.onended = () => { if (voiceSrc === src) musicOut.gain.setTargetAtTime(MUSIC_VOL, ac.currentTime, 0.4); };
}

// Original sneaky-bouncy chiptune, loops forever. One melody note per eighth ('-' = rest), one bass note per quarter.
const TUNE = ('C5 - E5 G5 - E5 C5 - D5 - F5 A5 - F5 D5 - E5 - G5 C6 - G5 E5 - F5 E5 D5 - G4 - - - ' +
              'C5 - E5 G5 - E5 C5 - D5 - F5 A5 - F5 D5 - E5 G5 E5 C5 D5 B4 G4 - C5 - C5 - C5 - - -').split(' ');
const BASS = ('C3 G3 C3 G3 D3 A3 D3 A3 C3 G3 C3 G3 G2 D3 G2 D3 ' +
              'C3 G3 C3 G3 D3 A3 D3 A3 C3 G3 G2 D3 C3 G3 C3 -').split(' ');
const freq = n => 440 * 2 ** (({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]] + 12 * (+n[1] + 1) - 69) / 12);
const EIGHTH = 0.16;
let step = 0, nextT = 0;
function music() {
  if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;  // tab was asleep: pick up from now
  while (nextT < ac.currentTime + 0.3) {
    const at = nextT - ac.currentTime, m = TUNE[step % TUNE.length], b = BASS[(step >> 1) % BASS.length];
    if (m !== '-') tone(freq(m), at, EIGHTH * 0.7, 'square', 0.1, musicOut);
    if (step % 2 === 0 && b !== '-') tone(freq(b), at, EIGHTH * 1.6, 'triangle', 0.3, musicOut);
    step++;
    nextT += EIGHTH;
  }
}
async function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();  // must be created inside the tap (iOS)
  musicOut = ac.createGain();
  musicOut.gain.value = MUSIC_VOL;
  musicOut.connect(ac.destination);
  await Promise.all(Object.entries(window.VOICE).map(async ([k, b64]) =>
    voices[k] = await ac.decodeAudioData(Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer)));
  setInterval(music, 100);
}

// ---------- scene helpers ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffe4ef');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const TAN = Math.tan(THREE.MathUtils.degToRad(20));

scene.add(new THREE.HemisphereLight('#ffffff', '#e0b0c0', 2));
const sun = new THREE.DirectionalLight('#fff3e0', 2.2);
sun.position.set(3, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);

const mats = {};
const mat = c => mats[c] ??= new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
function add(geo, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(geo, typeof color === 'string' ? mat(color) : color);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d, c, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), c, x, y, z, p);
const cyl = (r, h, c, x, y, z, p, r2 = r) => add(new THREE.CylinderGeometry(r, r2, h, 28), c, x, y, z, p);
const ball = (r, c, x, y, z, p) => add(new THREE.SphereGeometry(r, 24, 16), c, x, y, z, p);
const capsule = (r, len, c, x, y, z, p) => add(new THREE.CapsuleGeometry(r, len, 4, 12), c, x, y, z, p);
const cap = (r, c, p) => add(new THREE.SphereGeometry(r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), c, 0, 0.02, -0.02, p);
function group(x, z, rotY = 0, y = 0, parent = scene) {
  const g = new THREE.Group();
  g.position.set(x, y, z); g.rotation.y = rotY;
  parent.add(g);
  return g;
}

// ---------- the ice cream parlor ----------
const tiles = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#ffb3cf'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6.5, 3.6);
  t.magFilter = THREE.NearestFilter;
  return t;
})();
box(13, 0.2, 7.2, new THREE.MeshStandardMaterial({ map: tiles, roughness: 0.8 }), 0, -0.1, 0.4);
box(13.4, 4.5, 0.2, '#b9f0e0', 0, 2.25, -3.3);   // back wall
box(0.2, 4.5, 7.2, '#c9e8ff', -6.6, 2.25, 0.4);  // side walls
box(0.2, 4.5, 7.2, '#c9e8ff', 6.6, 2.25, 0.4);
for (let x = -6.2; x <= 6.2; x += 0.8) box(0.4, 0.5, 0.05, x % 1.6 ? '#ff8fab' : '#ffffff', x, 4.0, -3.17);  // awning stripes

// big cone sign + back counter with cones
const sign = group(0, -3.15, 0, 2.6);
add(new THREE.ConeGeometry(0.45, 1.1, 20), '#e0a458', 0, -0.2, 0, sign).rotation.x = Math.PI;
ball(0.42, '#ff8fab', 0, 0.5, 0, sign);
ball(0.36, '#fff3c4', 0, 0.95, 0, sign);
ball(0.1, '#e53950', 0, 1.33, 0, sign);
box(12.8, 1.0, 0.8, '#ffffff', 0, 0.5, -2.8);
box(12.8, 0.08, 0.85, '#ff8fab', 0, 1.04, -2.8);
for (const x of [-4.5, -4.2, 4.2, 4.5]) for (let i = 0; i < 4; i++)
  add(new THREE.ConeGeometry(0.13, 0.32, 14), '#e0a458', x, 1.25 + i * 0.09, -2.8).rotation.x = Math.PI;

// display counter with 12 tubs of ice cream
box(11.4, 0.95, 1.9, '#ffffff', 0, 0.475, 0);
box(11.4, 0.2, 0.04, '#ff8fab', 0, 0.2, 0.96);
box(11.4, 0.2, 0.04, '#9fd8ff', 0, 0.5, 0.96);
const FLAVORS = [
  ['strawberry', '#ff8fab'], ['chocolate', '#7a4a2e'], ['vanilla', '#fff3c4'], ['mint', '#a8e6cf', '#3e2723'],
  ['blueberry', '#7b8cde'], ['mango', '#ffb347'], ['pistachio', '#b5d99c'], ['bubblegum', '#ff6ec7'],
  ['lemon', '#fff176'], ['cookies', '#f2efe9', '#222222'], ['cherry', '#e53950'], ['cottoncandy', '#9fd8ff'],
];
const tubs = FLAVORS.map(([key, color, chips], i) => {
  const x = -4.5 + (i % 6) * 1.8 + (i < 6 ? 0 : 0.3), z = i < 6 ? -0.45 : 0.45;
  const g = group(x, z, 0, 0.95);
  cyl(0.42, 0.18, '#dfe6ea', 0, 0.09, 0, g);
  const dome = add(new THREE.SphereGeometry(0.38, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0, roughness: 0.6 }), 0, 0.17, 0, g);
  dome.scale.y = 0.7;
  if (chips) for (let c = 0; c < 9; c++) {
    const a = c * 2.4, r = 0.12 + (c % 3) * 0.08;
    box(0.06, 0.03, 0.06, chips, Math.cos(a) * r, 0, Math.sin(a) * r, dome).position.y = Math.sqrt(0.38 ** 2 - r * r) - 0.01;
  }
  const ring = add(new THREE.TorusGeometry(0.5, 0.04, 8, 32), new THREE.MeshStandardMaterial({ color: '#ffd54f', emissive: '#ffd54f', emissiveIntensity: 1 }), 0, 0.55, 0, g);
  ring.rotation.x = Math.PI / 2;
  ring.visible = false;
  const t = { key, color, x, g, dome, ring, glow: false, empty: false };
  g.userData.tub = t;
  return t;
});

// ---------- the four kids ----------
// Cartoon look-alikes of the family's kids (hair, shirts, sizes). The photos themselves stay local and are never used here.
const KIDS = [
  { scale: 1.12, skin: '#f3cdb0', hair: '#7a5232', style: 'long', shirt: '#fafafa', pants: '#b8bcc2', chest: 'bow' },
  { scale: 1.0, skin: '#f6d3b8', hair: '#8a6a48', style: 'swept', shirt: '#fafafa', pants: '#b0b6bd', chest: 'dots', tongue: true },
  { scale: 0.96, skin: '#f3c9a8', hair: '#2b1b12', style: 'shaggy', shirt: '#2f45c8', pants: '#9ea4ab' },
  { scale: 0.78, skin: '#f0c49e', hair: '#9a6a40', style: 'baby', shirt: '#f07a6a', pants: '#f07a6a' },
];
function hair(head, style, c) {
  if (style === 'long') {        // long hair pulled half-up, strands by the face
    cap(0.32, c, head).rotation.x = -0.3;
    box(0.56, 0.6, 0.14, c, 0, -0.22, -0.22, head);
    ball(0.13, c, 0, 0.12, -0.36, head);
    capsule(0.08, 0.3, c, 0, -0.15, -0.42, head);
    for (const s of [-1, 1]) capsule(0.07, 0.3, c, 0.27 * s, -0.12, 0.06, head);
  } else if (style === 'swept') { // short, fringe swept to the side
    cap(0.32, c, head).rotation.x = -0.35;
    for (const [x, y] of [[-0.17, 0.17], [-0.04, 0.21], [0.1, 0.2]]) ball(0.1, c, x, y, 0.19, head);
  } else if (style === 'shaggy') { // dark, shaggy bangs
    cap(0.33, c, head).rotation.x = -0.3;
    for (const [x, y] of [[-0.16, 0.17], [-0.05, 0.2], [0.07, 0.2], [0.17, 0.16]]) ball(0.1, c, x, y, 0.2, head);
    ball(0.08, c, 0.04, 0.33, -0.02, head);
  } else {                         // toddler: short and soft
    cap(0.31, c, head).rotation.x = -0.45;
    ball(0.06, c, 0.05, 0.31, 0.05, head);
  }
}
function makeKid(k) {
  const g = group(0, 0);
  g.scale.setScalar(k.scale);
  const shirt = new THREE.MeshStandardMaterial({ color: k.shirt, roughness: 0.7 });
  const legs = [-1, 1].map(s => {
    const hip = group(0.1 * s, 0, 0, 0.45, g);
    capsule(0.085, 0.25, k.pants, 0, -0.2, 0, hip);
    box(0.15, 0.08, 0.24, '#ffffff', 0, -0.41, 0.04, hip);
    return hip;
  });
  add(new THREE.CapsuleGeometry(0.2, 0.2, 6, 16), shirt, 0, 0.72, 0, g);
  const chest = group(0, 0, 0, 0, g);
  if (k.chest === 'bow') { for (const s of [-1, 1]) ball(0.06, '#e53935', 0.06 * s, 0.82, 0.19, chest); ball(0.035, '#e53935', 0, 0.82, 0.21, chest); }
  if (k.chest === 'dots') for (const [x, y] of [[-0.1, 0.85], [0.08, 0.78], [-0.05, 0.65], [0.11, 0.6]]) ball(0.035, '#ffd600', x, y, 0.19, chest);
  const arms = [-1, 1].map(s => {
    const sh = group(0.26 * s, 0, 0, 0.92, g);
    add(new THREE.CapsuleGeometry(0.065, 0.25, 4, 10), shirt, 0, -0.17, 0, sh);
    ball(0.07, k.skin, 0, -0.36, 0, sh);
    return sh;
  });
  const head = group(0, 0, 0, 1.25, g);
  ball(0.3, k.skin, 0, 0, 0, head);
  hair(head, k.style, k.hair);
  for (const s of [-1, 1]) {
    ball(0.06, '#ffffff', 0.1 * s, 0.02, 0.285, head);
    ball(0.035, '#3b2415', 0.1 * s, 0.02, 0.33, head);
    ball(0.05, '#ff9e9e', 0.18 * s, -0.08, 0.23, head).scale.z = 0.4;
    ball(0.07, k.skin, 0.3 * s, 0, 0, head);
  }
  ball(0.035, k.skin, 0, -0.03, 0.3, head);
  add(new THREE.TorusGeometry(0.08, 0.018, 8, 16, Math.PI), '#8a3030', 0, -0.1, 0.26, head).rotation.z = Math.PI;
  if (k.tongue) ball(0.045, '#ff7b9c', 0.03, -0.15, 0.25, head);

  // role costumes (shown by setRole)
  const policeCap = group(0, 0, 0, 0.2, head);
  cyl(0.31, 0.14, '#1d2f5e', 0, 0.07, 0, policeCap, 0.3);
  cyl(0.33, 0.04, '#1d2f5e', 0, 0.16, 0, policeCap);
  box(0.36, 0.03, 0.2, '#111111', 0, 0.01, 0.3, policeCap);
  ball(0.05, '#ffd54f', 0, 0.09, 0.3, policeCap).scale.z = 0.4;
  const badge = ball(0.05, '#ffd54f', -0.11, 0.85, 0.19, g);
  const chefHat = group(0, 0, 0, 0.22, head);
  cyl(0.24, 0.3, '#ffffff', 0, 0.15, 0, chefHat, 0.28);
  cyl(0.285, 0.07, '#ff8fab', 0, 0.03, 0, chefHat);
  const apron = box(0.34, 0.42, 0.04, '#ff8fab', 0, 0.62, 0.2, g);
  const mask = add(new THREE.TorusGeometry(0.3, 0.055, 8, 32), '#111111', 0, 0.02, 0, head);
  mask.rotation.x = Math.PI / 2;
  const cone = group(0.26, 0.3, 0, 0.6, g);
  add(new THREE.ConeGeometry(0.11, 0.3, 16), '#e0a458', 0, 0.15, 0, cone).rotation.x = Math.PI;

  const kid = { k, g, legs, arms, head, shirt, chest, policeCap, badge, chefHat, apron, mask, cone,
    target: null, arrive: null, speed: 2.5, face: 0, phase: 0, jumpY: 0, dance: false, role: null };
  g.userData.kid = kid;
  return kid;
}
const kids = KIDS.map(makeKid);

function setRole(kid, role) {
  kid.role = role;
  kid.shirt.color.set(role === 'police' ? '#25407c' : role === 'icecream' ? '#ffffff' : kid.k.shirt);
  kid.policeCap.visible = kid.badge.visible = role === 'police';
  kid.chefHat.visible = kid.apron.visible = role === 'icecream';
  kid.chest.visible = role !== 'police' && role !== 'icecream';
  kid.mask.visible = role === 'thief';
  kid.cone.visible = role === 'thief';
  for (const s of kid.cone.children.filter(o => o.userData.scoop)) kid.cone.remove(s);
}
const walk = (kid, x, z, arrive = null) => { kid.target = new THREE.Vector3(x, 0, z); kid.arrive = arrive; };
const byRole = r => kids.filter(k => k.role === r);

// ---------- game ----------
const tweens = [];
const tween = (dur, fn, done) => tweens.push({ t: 0, dur, fn, done });
const easeOut = k => 1 - (1 - k) ** 3;
const jump = kid => tween(0.45, k => kid.jumpY = Math.sin(k * Math.PI) * 0.45);
const clamp = THREE.MathUtils.clamp;
const GOAL = 10, POLICE_Z = 1.5;
let phase = 'start', score = 0, waveIn = 0, caughtCount = 0;
const promptEl = document.getElementById('prompt');
const scoreEl = document.getElementById('score');
const scoreIcons = Array.from({ length: GOAL }, () => scoreEl.appendChild(Object.assign(document.createElement('span'), { textContent: '🍦' })));

function teleport(kid, x, z) {  // poof out, poof in somewhere else
  poof();
  tween(0.2, k => kid.g.scale.setScalar(kid.k.scale * (1 - k) + 0.001), () => {
    kid.g.position.set(x, 0, z);
    kid.target = null;
    tween(0.25, k => kid.g.scale.setScalar(kid.k.scale * easeOut(k) + 0.001));
  });
}

function pickKid(kid) {
  if (phase === 'pickPolice') {
    setRole(kid, 'police');
    jump(kid); poof();
    phase = 'pickIcecream';
    promptEl.textContent = '🍦❓';
    speak('pickIcecream');
  } else if (phase === 'pickIcecream' && !kid.role) {
    setRole(kid, 'icecream');
    teleport(kid, 0, -1.6);
    for (const k of kids.filter(k => !k.role)) setRole(k, 'thief');
    const [police] = byRole('police'), thieves = byRole('thief').sort((a, b) => a.g.position.x - b.g.position.x);
    walk(police, 0, POLICE_Z);
    walk(thieves[0], -4.9, 2.5, () => thieves[0].face = 0.5);
    walk(thieves[1], 4.9, 2.5, () => thieves[1].face = -0.5);
    promptEl.textContent = '';
    phase = 'play';
    speak('intro');
    waveIn = Math.max(2, (voices.intro?.duration ?? 4) - 1.5);
  }
}

function setGlow(t, on) {
  t.glow = on;
  t.ring.visible = on;
  t.dome.material.emissiveIntensity = 0;
  t.dome.scale.set(1, t.empty ? 0.3 : 0.7, 1);
}
function wave() {  // light up 1-3 flavors; more as the score goes up
  const n = score < 3 ? 1 : score < 7 ? 2 : 3;
  const free = tubs.filter(t => !t.glow && !t.empty).sort(() => Math.random() - 0.5);  // ponytail: biased shuffle, fine for picking glows
  free.slice(0, n).forEach(t => setGlow(t, true));
  sparkle();
}

function steal(t) {
  setGlow(t, false);
  t.empty = true;
  tween(0.3, k => t.dome.scale.y = 0.7 - 0.4 * k);
  const thief = byRole('thief').sort((a, b) => Math.abs(a.g.position.x - t.x) - Math.abs(b.g.position.x - t.x))[0];
  speak(t.key); ding(); jump(thief);
  const n = thief.cone.children.filter(o => o.userData.scoop).length;
  const s = ball(0.17, t.color, t.x, 1.3, t.g.position.z);
  s.userData.scoop = true;
  const from = s.position.clone(), to = new THREE.Vector3();
  tween(0.8, k => {
    thief.cone.getWorldPosition(to);
    to.y += (0.38 + n * 0.22) * thief.k.scale;
    s.position.lerpVectors(from, to, easeOut(k));
    s.position.y += Math.sin(k * Math.PI) * 1.5;
  }, () => {
    thief.cone.attach(s);
    scoreIcons[score].classList.add('got');
    if (++score === GOAL) win();
  });
  // the ice cream man hurries over and refills it
  const [man] = byRole('icecream');
  walk(man, clamp(t.x, -5, 5), -1.6);
  tween(2.2, () => {}, () => { t.empty = false; if (!t.glow) tween(0.4, k => t.dome.scale.y = 0.3 + 0.4 * k); });
}

function caught(t) {
  const [police] = byRole('police');
  setGlow(t, false);
  whistle(); jump(police);
  speak('caught' + (++caughtCount % 2 + 1));
}

function win() {
  phase = 'done';
  for (const t of tubs) setGlow(t, false);
  fanfare();
  setTimeout(() => speak('win'), 1300);
  setTimeout(() => {  // ice cream for everyone!
    for (const kid of kids) {
      kid.target = null;
      kid.dance = true;
      if (kid.role !== 'thief') {
        kid.cone.visible = true;
        const s = ball(0.17, FLAVORS[Math.random() * 12 | 0][1], 0, 0.38, 0, kid.cone);
        s.userData.scoop = true;
      }
    }
  }, 4000);
  const fun = ['🍦', '🍨', '⭐', '🎉', '✨'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.textContent = fun[i % fun.length];
    d.style.left = Math.random() * 95 + 'vw';
    d.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.append(d);
    setTimeout(() => d.remove(), 5000);
  }
  setTimeout(() => showOverlay('🎉', '🔄'), 8000);
}

function newGame() {
  tweens.length = 0;
  score = 0;
  scoreIcons.forEach(s => s.classList.remove('got'));
  for (const t of tubs) { t.empty = false; setGlow(t, false); }
  kids.forEach((kid, i) => {
    setRole(kid, null);
    kid.g.position.set(-3.3 + i * 2.2, 0, 2.7);
    kid.g.scale.setScalar(kid.k.scale);
    kid.g.rotation.y = kid.face = 0;
    kid.target = null;
    kid.dance = false;
    kid.jumpY = 0;
  });
  phase = 'pickPolice';
  promptEl.textContent = '👮❓';
  speak('pickPolice');
}

const overlay = document.getElementById('overlay');
function showOverlay(msg, button) {
  document.getElementById('msg').textContent = msg;
  document.getElementById('go').textContent = button;
  overlay.hidden = false;
}
document.getElementById('go').onclick = async () => {
  overlay.hidden = true;
  await startAudio();
  newGame();
};

// tap / click: pick kids at the start, then grab glowing flavors
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => {
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const pickFrom = phase === 'play' ? tubs.map(t => t.g) : kids.map(k => k.g);
  let o = ray.intersectObjects(pickFrom, true)[0]?.object;
  while (o && !o.userData.tub && !o.userData.kid) o = o.parent;
  if (!o) return;
  if (phase === 'play' && o.userData.tub.glow) steal(o.userData.tub);
  if (phase.startsWith('pick')) pickKid(o.userData.kid);
});

let dist = 12, tilt = [0.62, 0.78];
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  dist = clamp(6.9 / (TAN * camera.aspect), 11, 30);  // always fit the whole counter
  tilt = camera.aspect < 1 ? [0.75, 0.66] : [0.62, 0.78];
  camera.position.set(0, 0.9 + dist * tilt[0], 0.5 + dist * tilt[1]);
  camera.lookAt(0, 0.9, 0.5);
}
addEventListener('resize', resize);
resize();

let last = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  for (const tw of tweens.slice()) {
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    tw.fn(tw.t);
    if (tw.t === 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done?.(); }
  }

  if (phase === 'play') {
    const glowing = tubs.filter(tb => tb.glow);
    if (!glowing.length && (waveIn -= dt) <= 0) { wave(); waveIn = 1.2; }
    // the police officer runs to the closest glowing flavor
    const [police] = byRole('police');
    police.speed = 1.6 + score * 0.1;
    const chase = glowing.sort((a, b) => Math.abs(a.x - police.g.position.x) - Math.abs(b.x - police.g.position.x))[0];
    if (chase) walk(police, chase.x, POLICE_Z, () => chase.glow && caught(chase));
    else if (!police.target && Math.abs(police.g.position.x) > 0.1) walk(police, 0, POLICE_Z);
  }
  for (const tb of tubs) if (tb.glow) {
    tb.dome.material.emissiveIntensity = 0.5 + 0.4 * Math.sin(t / 90);
    tb.dome.scale.set(1, 0.7 + 0.06 * Math.sin(t / 90), 1);
    tb.ring.rotation.z += dt * 3;
  }

  for (const kid of kids) {
    const p = kid.g.position;
    let moving = false;
    if (kid.target) {
      const dx = kid.target.x - p.x, dz = kid.target.z - p.z, d = Math.hypot(dx, dz);
      if (d < 0.05) {
        const arrive = kid.arrive;
        kid.target = kid.arrive = null;
        kid.face = 0;
        arrive?.();
      } else {
        const s = Math.min(d, kid.speed * dt);
        p.x += dx / d * s;
        p.z += dz / d * s;
        kid.face = Math.atan2(dx, dz);
        moving = true;
      }
    }
    kid.phase = moving ? kid.phase + dt * 11 : 0;
    const swing = Math.sin(kid.phase) * 0.6;
    kid.legs[0].rotation.x = swing; kid.legs[1].rotation.x = -swing;
    kid.arms[0].rotation.x = -swing;
    kid.arms[1].rotation.x = kid.cone.visible ? -0.9 : swing;  // holding a cone
    if (kid.dance) { kid.jumpY = Math.abs(Math.sin(t / 170 + kid.k.scale * 3)) * 0.4; kid.face += dt * 3; }
    p.y = kid.jumpY + (moving ? Math.abs(Math.sin(kid.phase)) * 0.06 : 0);
    const da = kid.face - kid.g.rotation.y;
    kid.g.rotation.y += Math.atan2(Math.sin(da), Math.cos(da)) * Math.min(1, dt * 12);
  }
  renderer.render(scene, camera);
});
newGame();
phase = 'start';
promptEl.textContent = '';
</script>
</body>
