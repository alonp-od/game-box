<script type="module">
import * as THREE from '../lib/three.module.min.js';

// ---------- sounds, voice & music ----------
let ac, musicOut, voiceSrc;
const voices = {}, MUSIC_VOL = 0.35;
function tone(f, at, dur, type = 'triangle', vol = 0.2, out = ac?.destination) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur);
}
const ding = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.35));
const boop = () => { tone(330, 0, 0.25, 'sine'); tone(247, 0.18, 0.35, 'sine'); };
const plop = () => tone(880, 0, 0.15, 'square', 0.06);
const fanfare = () => [523, 523, 523, 659, 784, 0, 659, 1047].forEach((f, i) => f && tone(f, i * 0.14, 0.4));

// Voice lines are recorded ahead of time (python3 tools/voice.py) and embedded in #voice-data, so they work offline.
function speak(key) {
  const buf = voices[key];
  if (!buf) return;
  voiceSrc?.stop();
  const src = voiceSrc = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
  musicOut.gain.setTargetAtTime(0, ac.currentTime, 0.05);  // music pauses while the voice talks
  src.onended = () => { if (voiceSrc === src) musicOut.gain.setTargetAtTime(MUSIC_VOL, ac.currentTime, 0.4); };
}

// Original bouncy chiptune, loops forever. One melody note per eighth ('-' = rest), one bass note per quarter.
const TUNE = ('E5 G5 C6 G5 A5 G5 E5 - F5 A5 G5 E5 D5 E5 C5 - E5 G5 C6 G5 A5 C6 D6 - C6 B5 A5 G5 E5 D5 C5 - ' +
              'A5 - A5 G5 F5 - E5 - G5 - G5 F5 E5 - D5 - E5 G5 A5 B5 C6 - G5 - C6 - G5 - C5 - - -').split(' ');
const BASS = ('C3 G3 C3 G3 F3 C3 G2 G3 C3 G3 F3 A3 G2 D3 C3 C3 ' +
              'F3 C3 F3 C3 G2 D3 G2 D3 C3 G3 F3 G3 C3 G3 C3 -').split(' ');
const freq = n => 440 * 2 ** (({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]] + 12 * (+n[1] + 1) - 69) / 12);
const EIGHTH = 0.17;
let step = 0, nextT = 0;
function music() {
  if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;  // tab was asleep: pick up from now
  while (nextT < ac.currentTime + 0.3) {
    const at = nextT - ac.currentTime, m = TUNE[step % TUNE.length], b = BASS[(step >> 1) % BASS.length];
    if (m !== '-') tone(freq(m), at, EIGHTH * 0.8, 'square', 0.1, musicOut);

    step++;

  musicOut.connect(ac.destination);

    voices[k] = await ac.decodeAudioData(Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer)));

// ---------- game ----------
const tweens = [];
const tween = (dur, fn, done) => tweens.push({ t: 0, dur, fn, done });
const easeOut = k => 1 - (1 - k) ** 3;
const easeBack = k => 1 + 2.7 * (k - 1) ** 3 + 1.7 * (k - 1) ** 2;

const SPEED = 3;
const clamp = THREE.MathUtils.clamp;
let playing = false, celebrating = false, found = 0;
let target = null, targetSpot = null, faceAngle = 0, jumpY = 0, phase = 0, camX = 0, dist = 14, tilt = [0.6, 0.8];

function clampFloor(p) {
  p.z = clamp(p.z, -2.0, 4);
  p.x = clamp(p.x, p.z < -1.6 ? -5.3 : -4.3, 3.7);
  return p;
}
function walkTo(point, s = null) { target = point; targetSpot = s; }
const jump = () => tween(0.45, k => jumpY = Math.sin(k * Math.PI) * 0.45);

function openSpot(s) {
  if (s.opened) return;
  s.opened = true;
  if (s.open) tween(0.5, k => s.open(easeOut(k)));
  if (!s.item) {
    boop();
    speak('empty' + (1 + Math.random() * 3 | 0));
    tween(0.8, k => head.rotation.y = Math.sin(k * Math.PI * 4) * 0.5 * (1 - k));
    return;
  }
  const it = item(s.item), m = it.mesh;
  ding(); jump(); speak(it.key);
  m.visible = true;
  m.position.copy(s.reveal);
  tween(0.7, k => {
    if (s.open) m.scale.setScalar(Math.max(0.01, easeBack(k) * ITEM_SIZE));  // hidden food grows out of its hiding place
    m.position.y = s.reveal.y + k * 0.8;
    m.rotation.y = k * 6.28;
  }, () => {
    const from = m.position.clone(), to = new THREE.Vector3(...it.slot);
    tween(1.1, k => {
      m.position.lerpVectors(from, to, easeOut(k));
      m.position.y += Math.sin(k * Math.PI) * 1.2;
      m.rotation.y = k * 6.28;
    }, () => {
      plop();
      it.hud.classList.add('got');
      if (++found === ITEMS.length) win();
    });
  });
}

function win() {
  playing = false;
  celebrating = true;
  fanfare();
  setTimeout(() => speak('win'), 1200);
  const fun = ['🎉', '✨', '🥞', '🥓', '🥛', '⭐'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.textContent = fun[i % fun.length];
    d.style.left = Math.random() * 95 + 'vw';
    d.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.append(d);
    setTimeout(() => d.remove(), 5000);
  }
  setTimeout(() => showOverlay('🎉', '🔄'), 3000);
}

function newGame() {
  tweens.length = 0;
  found = 0;
  celebrating = false;
  for (const s of spots) { s.opened = false; s.open?.(0); }
  for (const it of ITEMS) {
    const s = spots.find(s => s.item === it.key), m = it.mesh;
    m.position.copy(s.reveal);
    m.rotation.set(0, 0, 0);
    m.scale.setScalar(ITEM_SIZE);
    m.visible = !s.open;  // food out in the open shows from the start; hidden food appears when found
    it.hud.classList.remove('got');
  }
  lenny.position.set(0, 0, 1.5);
  lenny.rotation.y = faceAngle = 0;
  head.rotation.y = 0;
  arms.forEach(a => a.rotation.set(0, 0, 0));
  target = targetSpot = null;
}

function showOverlay(msg, button) {
  document.getElementById('msg').textContent = msg;
  document.getElementById('go').textContent = button;
  overlay.hidden = false;

// tap / click
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => {
  if (!playing) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(scene.children.filter(o => o !== lenny && o.visible), true)[0]; // taps go "through" Lenny and hidden food
  if (!hit) return;
  let o = hit.object;
  while (o && !o.userData.spot) o = o.parent;
  if (o && !o.userData.spot.opened) walkTo(o.userData.spot.stand, o.userData.spot);
  else walkTo(clampFloor(hit.point.clone()));
});

// keyboard: arrows/WASD walk, space/enter opens the closest hiding place
const keys = {};
const key = k => keys[k] ? 1 : 0;
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (playing && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    const near = spots.filter(s => !s.opened).sort((a, b) => a.stand.distanceTo(lenny.position) - b.stand.distanceTo(lenny.position))[0];
    if (near && near.stand.distanceTo(lenny.position) < 1.6) walkTo(near.stand, near);
  }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  dist = clamp(6.8 / (TAN * camera.aspect), 13, 22);     // fit the room's width; if it can't (portrait), camera follows Lenny
  tilt = camera.aspect < 1 ? [0.75, 0.66] : [0.6, 0.8];
}
addEventListener('resize', resize);
resize();

let last = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  for (const tw of tweens.slice()) {
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    tw.fn(tw.t);
    if (tw.t === 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done?.(); }
  }

  const p = lenny.position;
  let moving = false;
  const kx = key('arrowright') + key('d') - key('arrowleft') - key('a');
  const kz = key('arrowdown') + key('s') - key('arrowup') - key('w');
  if (playing && (kx || kz)) {
    target = null;
    const l = Math.hypot(kx, kz);
    p.x += kx / l * SPEED * dt;
    p.z += kz / l * SPEED * dt;
    clampFloor(p);
    faceAngle = Math.atan2(kx, kz);
    moving = true;
  } else if (target) {
    const dx = target.x - p.x, dz = target.z - p.z, d = Math.hypot(dx, dz);
    if (d < 0.05) {
      const s = targetSpot;
      target = targetSpot = null;
      if (s) { faceAngle = s.face; openSpot(s); }
    } else {
      const step = Math.min(d, SPEED * dt);
      p.x += dx / d * step;
      p.z += dz / d * step;
      faceAngle = Math.atan2(dx, dz);
      moving = true;
    }
  }

  phase = moving ? phase + dt * 11 : 0;
  const swing = Math.sin(phase) * 0.6;
  legs[0].rotation.x = swing; legs[1].rotation.x = -swing;
  arms[0].rotation.x = -swing; arms[1].rotation.x = swing;
  if (celebrating) {
    jumpY = Math.abs(Math.sin(t / 170)) * 0.5;
    faceAngle += dt * 4;
    arms[0].rotation.z = -2.6; arms[1].rotation.z = 2.6;
  }
  p.y = jumpY + (moving ? Math.abs(Math.sin(phase)) * 0.06 : 0);
  const da = faceAngle - lenny.rotation.y;
  lenny.rotation.y += Math.atan2(Math.sin(da), Math.cos(da)) * Math.min(1, dt * 12);

  const half = dist * TAN * camera.aspect, maxX = Math.max(0, 6.6 - half);
  camX += (clamp(p.x, -maxX, maxX) - camX) * Math.min(1, dt * 3);
  camera.position.set(camX, 1 + dist * tilt[0], -0.3 + dist * tilt[1]);
  camera.lookAt(camX, 1, -0.3);
  renderer.render(scene, camera);
});
newGame();
</script>
