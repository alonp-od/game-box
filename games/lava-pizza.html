<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3a1a0a; font-family: system-ui, sans-serif;

  canvas { display: block; touch-action: none; }
  #home { position: fixed; top: 12px; left: 12px; z-index: 2; font-size: 2.4rem; background: #fff8e7; border: 4px solid #c62828;
    border-radius: 50%; width: 4.2rem; height: 4.2rem; display: grid; place-items: center; box-shadow: 0 5px 0 #7a1010; text-decoration: none; }
  #trail { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: .15rem; font-size: min(2rem, 5.5vw);
    background: #fff8e7; border: 4px solid #2e7d32; border-radius: 2rem; padding: .1rem .6rem; box-shadow: 0 5px 0 #1b5e20; }

  #prompt { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 5.5rem; pointer-events: none;
    animation: bob 1s ease-in-out infinite; filter: drop-shadow(0 6px 0 #0004); }
  @keyframes bob { 50% { transform: translate(-50%, -10px); } }
  #overlay { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; background: #3a1a0acc; font-size: 6rem; text-align: center; }
  #overlay[hidden] { display: none; }
  #go { font-size: 5rem; background: #fff8e7; border: 6px solid #c62828; border-radius: 2rem; padding: .4rem 2.2rem; box-shadow: 0 8px 0 #7a1010; }
  #go:active { transform: translateY(5px); box-shadow: 0 3px 0 #7a1010; }
  .conf { position: fixed; top: -12vh; z-index: 4; font-size: 2.6rem; pointer-events: none; animation: fall 3.2s linear forwards; }
  @keyframes fall { to { transform: translateY(125vh) rotate(720deg); } }
</style>

<script type="module">
import * as THREE from '../lib/three.module.min.js';

// ---------- sounds, voice & music ----------
let ac, musicOut, voiceSrc;
const voices = {}, MUSIC_VOL = 0.32;
function tone(f, at, dur, type = 'triangle', vol = 0.2, out = ac?.destination) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur);
}
function slide(f1, f2, dur, type = 'square', vol = 0.08) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
const boing = () => slide(300, 900, 0.25);
const squish = () => tone(180, 0, 0.15, 'sine', 0.3);
const sizzle = () => { slide(900, 120, 0.6, 'sawtooth', 0.06); slide(1400, 300, 0.4, 'square', 0.04); };
const poof = () => tone(300, 0, 0.2, 'sine', 0.2);
const fanfare = () => [523, 659, 784, 1047, 0, 784, 1047].forEach((f, i) => f && tone(f, i * 0.12, 0.4));

// Voice lines are recorded ahead of time (python3 tools/voice.py) and embedded in #voice-data, so they work offline.
function speak(key) {
  const buf = voices[key];
  if (!buf) return;
  voiceSrc?.stop();
  const src = voiceSrc = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
  musicOut.gain.setTargetAtTime(0.06, ac.currentTime, 0.05);  // music dips while the voice talks
  src.onended = () => { if (voiceSrc === src) musicOut.gain.setTargetAtTime(MUSIC_VOL, ac.currentTime, 0.4); };
}

// Original bouncy pizzeria tune (a little tarantella-ish), loops forever. One melody note per eighth, one bass note per quarter.
const TUNE = ('A4 C5 E5 A5 - E5 C5 E5 A5 - G5 F5 E5 - - - D5 F5 A5 D6 - A5 F5 A5 E5 - D5 C5 B4 - - - ' +
              'A4 C5 E5 A5 - E5 C5 E5 A5 - B5 C6 B5 A5 G5 - F5 E5 D5 F5 E5 D5 C5 B4 A4 - E4 - A4 - - -').split(' ');
const BASS = ('A2 E3 A2 E3 A2 E3 A2 E3 D3 A3 D3 A3 E2 B2 E2 B2 ' +
              'A2 E3 A2 E3 F2 C3 F2 C3 D3 A3 E2 B2 A2 E3 A2 -').split(' ');
const freq = n => 440 * 2 ** (({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]] + 12 * (+n[1] + 1) - 69) / 12);
const EIGHTH = 0.14;
let step = 0, nextT = 0;
function music() {
  if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;  // tab was asleep: pick up from now
  while (nextT < ac.currentTime + 0.3) {
    const at = nextT - ac.currentTime, m = TUNE[step % TUNE.length], b = BASS[(step >> 1) % BASS.length];
    if (m !== '-') tone(freq(m), at, EIGHTH * 0.7, 'square', 0.08, musicOut);
    if (step % 2 === 0 && b !== '-') tone(freq(b), at, EIGHTH * 1.6, 'triangle', 0.3, musicOut);
    step++;
    nextT += EIGHTH;
  }
}
async function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();  // must be created inside the tap (iOS)
  musicOut = ac.createGain();
  musicOut.gain.value = MUSIC_VOL;
  musicOut.connect(ac.destination);
  await Promise.all(Object.entries(window.VOICE ?? {}).map(async ([k, b64]) =>
    voices[k] = await ac.decodeAudioData(Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer)));
  setInterval(music, 100);
}

// ---------- scene helpers ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#3a1a0a');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const TAN = Math.tan(THREE.MathUtils.degToRad(20));

scene.add(new THREE.HemisphereLight('#fff1d6', '#ff5a1f', 1.7));
const sun = new THREE.DirectionalLight('#fff1d6', 1.6);

function add(geo, color, x, y, z, parent = scene) {

// ---------- the pizzeria ----------
const ROOM_W = 12, FRONT = 8, BACK = -20, LEN = FRONT - BACK, MIDZ = (FRONT + BACK) / 2;
// lava floor: glowing orange blobs that slowly swirl
const lavaTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#ff5a00'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 8 + Math.random() * 30;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const c = ['#ffd000', '#ff9000', '#d42a00'][i % 3];
    grd.addColorStop(0, c); grd.addColorStop(1, c + '00');

    for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) { g.save(); g.translate(dx, dy); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }

const placeBubble = b => b.position.set((Math.random() - 0.5) * (ROOM_W - 1), 0, BACK + 1 + Math.random() * (LEN - 2));

// walls: red-and-white checker tiles below, warm cream above
const tileTex = canvasTex(64, (g, s) => {

for (const s of [-1, 1]) {

// back wall with the big brick pizza oven
box(ROOM_W, 4.5, 0.2, '#f7dca8', 0, 2.25, BACK - 0.1);

// ---------- start counter, pizzas, party table ----------
const START = { x: 0, z: FRONT - 1.6, top: 0.6 }, END = { x: 0, z: BACK + 3.2, top: 0.6 };
box(ROOM_W, START.top, 3.2, '#8d5a2b', 0, START.top / 2, START.z);
box(ROOM_W, 0.06, 3.2, '#c62828', 0, START.top + 0.03, START.z);
const endDeck = box(ROOM_W, END.top, 4, '#8d5a2b', 0, END.top / 2, END.z - 0.6);
const endTop = box(ROOM_W, 0.06, 4, '#2e7d32', 0, END.top + 0.03, END.z - 0.6);
const table = group(0, END.z - 1.5, 0, END.top);
cyl(1.4, 0.1, '#ffffff', 0, 0.75, 0, table);
cyl(1.45, 0.06, '#c62828', 0, 0.69, 0, table);

cyl(1.1, 0.08, '#e2a65a', 0, 0.84, 0, table);      // the giant party pizza
cyl(1.0, 0.03, '#ffd54f', 0, 0.89, 0, table);
for (let i = 0; i < 9; i++) { const a = i * 2.4, r = 0.25 + (i % 3) * 0.25; cyl(0.12, 0.02, '#c62828', Math.cos(a) * r, 0.91, Math.sin(a) * r, table); }
const endPad = { ...END };  // jump target at the party deck (x follows the jumper)

const TOPPINGS = [['#c62828', 0.13], ['#2e7d32', 0.09], ['#212121', 0.07], ['#8d6e63', 0.1]];
function makePizza(i) {
  const g = group(0, 0, Math.random() * 6, 0.05);
  cyl(0.95, 0.16, '#e2a65a', 0, 0, 0, g);
  cyl(0.85, 0.05, '#ffd54f', 0, 0.09, 0, g);
  const [tc, tr] = TOPPINGS[i % TOPPINGS.length];
  for (let k = 0; k < 7; k++) { const a = k * 2.2 + i, r = 0.25 + (k % 3) * 0.2; cyl(tr, 0.03, tc, Math.cos(a) * r, 0.12, Math.sin(a) * r, g); }
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.06, 8, 48), glowMat('#ffffff'));
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.12;
  g.add(ring);
  const p = { g, ring, top: 0.2, bx: 0, z: 0, amp: 0, ph: 0, sink: 0 };
  g.userData.pad = p;
  return p;
}
const N = 10, REACH = 3.1;
const pizzas = Array.from({ length: N }, (_, i) => makePizza(i));
endDeck.userData.pad = endTop.userData.pad = endPad;

function layout() {  // a new path every game: pizzas zig-zag toward the party; later ones drift side to side
  const gap = (START.z - 0.8 - (END.z + 1.6)) / (N - 1);
  let x = 0;
  pizzas.forEach((p, i) => {
    x = THREE.MathUtils.clamp(x + (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 0.9), -3.5, 3.5);
    p.bx = x; p.z = START.z - 0.8 - i * gap;
    p.amp = i < 2 ? 0 : 0.6 + Math.min(i, 6) * 0.15;  // first two sit still so she can learn
    p.ph = Math.random() * 6;
    p.g.position.set(p.bx, 0.05, p.z);
  });
}

// ---------- the four kids ----------
// Cartoon look-alikes of the family's kids (hair, shirts, sizes). The photos themselves stay local and are never used here.
const KIDS = [
  { scale: 1.12, skin: '#f3cdb0', hair: '#7a5232', style: 'long', shirt: '#fafafa', pants: '#b8bcc2', chest: 'bow' },
  { scale: 1.0, skin: '#f6d3b8', hair: '#8a6a48', style: 'swept', shirt: '#fafafa', pants: '#b0b6bd', chest: 'dots', tongue: true },
  { scale: 0.96, skin: '#f3c9a8', hair: '#2b1b12', style: 'shaggy', shirt: '#2f45c8', pants: '#9ea4ab' },
  { scale: 0.78, skin: '#f0c49e', hair: '#9a6a40', style: 'baby', shirt: '#f07a6a', pants: '#f07a6a' },

function hair(head, style, c) {

    box(0.56, 0.6, 0.14, c, 0, -0.22, -0.22, head);
    ball(0.13, c, 0, 0.12, -0.36, head);
    capsule(0.08, 0.3, c, 0, -0.15, -0.42, head);
    for (const s of [-1, 1]) capsule(0.07, 0.3, c, 0.27 * s, -0.12, 0.06, head);
  } else if (style === 'swept') { // short, fringe swept to the side
    cap(0.32, c, head).rotation.x = -0.35;
    for (const [x, y] of [[-0.17, 0.17], [-0.04, 0.21], [0.1, 0.2]]) ball(0.1, c, x, y, 0.19, head);
  } else if (style === 'shaggy') { // dark, shaggy bangs
    cap(0.33, c, head).rotation.x = -0.3;
    for (const [x, y] of [[-0.16, 0.17], [-0.05, 0.2], [0.07, 0.2], [0.17, 0.16]]) ball(0.1, c, x, y, 0.2, head);
    ball(0.08, c, 0.04, 0.33, -0.02, head);
  } else {                         // toddler: short and soft
    cap(0.31, c, head).rotation.x = -0.45;
    ball(0.06, c, 0.05, 0.31, 0.05, head);

function makeKid(k) {
  const g = group(0, 0);
  g.scale.setScalar(k.scale);
  const legs = [-1, 1].map(s => {
    const hip = group(0.1 * s, 0, 0, 0.45, g);
    capsule(0.085, 0.25, k.pants, 0, -0.2, 0, hip);
    box(0.15, 0.08, 0.24, '#ffffff', 0, -0.41, 0.04, hip);

  if (k.chest === 'dots') for (const [x, y] of [[-0.1, 0.85], [0.08, 0.78], [-0.05, 0.65], [0.11, 0.6]]) ball(0.035, '#ffd600', x, y, 0.19, g);
  const arms = [-1, 1].map(s => {
    const sh = group(0.26 * s, 0, 0, 0.92, g);
    capsule(0.065, 0.25, k.shirt, 0, -0.17, 0, sh);
    ball(0.07, k.skin, 0, -0.36, 0, sh);
    return sh;
  });
  const head = group(0, 0, 0, 1.25, g);
  ball(0.3, k.skin, 0, 0, 0, head);
  hair(head, k.style, k.hair);
  for (const s of [-1, 1]) {
    ball(0.06, '#ffffff', 0.1 * s, 0.02, 0.285, head);
    ball(0.035, '#3b2415', 0.1 * s, 0.02, 0.33, head);
    ball(0.05, '#ff9e9e', 0.18 * s, -0.08, 0.23, head).scale.z = 0.4;
    ball(0.07, k.skin, 0.3 * s, 0, 0, head);
  }
  ball(0.035, k.skin, 0, -0.03, 0.3, head);
  add(new THREE.TorusGeometry(0.08, 0.018, 8, 16, Math.PI), '#8a3030', 0, -0.1, 0.26, head).rotation.z = Math.PI;
  if (k.tongue) ball(0.045, '#ff7b9c', 0.03, -0.15, 0.25, head);

const kids = KIDS.map(makeKid);

// ---------- game ----------
const tweens = [];
const tween = (dur, fn, done) => tweens.push({ t: 0, dur, fn, done });
const easeOut = k => 1 - (1 - k) ** 3;
const padPos = p => new THREE.Vector3(p.g ? p.g.position.x : p.x, p.top, p.g ? p.g.position.z : p.z);
let phase = 'start', runner = null, on = null, jumping = false, hotCount = 0, camZ = START.z;
const promptEl = document.getElementById('prompt'), trailEl = document.getElementById('trail');
const trail = Array.from({ length: N }, () => trailEl.appendChild(Object.assign(document.createElement('span'), { textContent: '🍕' })));
trailEl.appendChild(Object.assign(document.createElement('span'), { textContent: '🎉' }));

function teleport(kid, x, y, z, face = 0) {  // poof out, poof in somewhere else
  poof();
  tween(0.2, k => kid.g.scale.setScalar(kid.k.scale * (1 - k) + 0.001), () => {
    kid.g.position.set(x, y, z);
    kid.face = face;
    tween(0.25, k => kid.g.scale.setScalar(kid.k.scale * easeOut(k) + 0.001));
  });
}

function pickKid(kid) {
  phase = 'play';
  runner = kid; on = START;
  promptEl.textContent = '';
  boing();
  jumpTo({ x: 0, z: START.z - 0.4, top: START.top }, true);
  const others = kids.filter(k => k !== kid);
  const spots = [[-3.8, END.z - 1.2, 0.6], [3.8, END.z - 1.2, -0.6], [-2, END.z - 0.6, 0.3]];
  others.forEach((k, i) => setTimeout(() => { teleport(k, spots[i][0], END.top, spots[i][1], spots[i][2]); k.mode = 'cheer'; }, 300 + i * 250));
  setTimeout(() => speak('go'), 900);
}

// jump in a big arc. Too far away? Fall short into the lava, hop out, and go back.
function jumpTo(pad, quiet) {
  if (jumping) return;
  const from = runner.g.position.clone();
  if (pad === endPad) endPad.x = THREE.MathUtils.clamp(from.x, -3, 3);
  const to0 = padPos(pad);
  const reach = Math.hypot(to0.x - from.x, to0.z - from.z) <= REACH;
  jumping = true;
  if (!quiet) boing();
  runner.face = Math.atan2(to0.x - from.x, to0.z - from.z);
  const short = reach ? null : from.clone().lerp(to0, 0.55).setY(-0.35);
  const back = on;
  tween(0.6, k => {
    const to = short ?? padPos(pad);  // follow a drifting pizza while in the air
    const p = runner.g.position;
    p.x = from.x + (to.x - from.x) * k;
    p.z = from.z + (to.z - from.z) * k;
    p.y = from.y + (to.y - from.y) * k + Math.sin(k * Math.PI) * 1.6;
  }, () => {
    jumping = false;
    if (!short) return land(pad);
    // ouch! into the lava
    sizzle();
    promptEl.textContent = '🔥';
    speak(hotCount++ % 2 ? 'hot2' : 'hot1');
    jumping = true;
    tween(0.9, k => runner.g.position.y = -0.35 + Math.abs(Math.sin(k * Math.PI * 3)) * 0.5 * (1 - k * 0.5), () => {
      jumping = false;
      promptEl.textContent = '';
      runner.g.position.y = -0.35;
      on = back;
      jumpTo(back, true);
    });
  });
}

function land(pad) {
  on = pad;
  squish();
  if (pad.g) {  // the pizza squishes down a little
    pad.sink = 1;
    const i = pizzas.indexOf(pad);
    if (!trail[i].classList.contains('got')) {
      trail[i].classList.add('got');
      if (i === 4) speak('half');
      else if (i === 7) speak('cheer' + (1 + (Math.random() * 2 | 0)));
    }
  }
  if (pad === endPad) win();
}

function win() {
  phase = 'done';
  trailEl.lastChild.classList.add('got');
  fanfare();
  setTimeout(() => speak('win'), 900);
  runner.face = 0;
  tween(0.6, k => { runner.g.position.x *= 1 - k; runner.g.position.z += (END.z - 0.4 - runner.g.position.z) * k; });
  for (const kid of kids) kid.mode = 'dance';
  const fun = ['🍕', '🎉', '⭐', '✨', '🍕'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.textContent = fun[i % fun.length];
    d.style.left = Math.random() * 95 + 'vw';
    d.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.append(d);
    setTimeout(() => d.remove(), 5000);
  }
  setTimeout(() => showOverlay('🍕🎉', '🔄'), 6000);
}

function newGame() {
  layout();
  runner = null; on = null; jumping = false; hotCount = 0; camZ = START.z;
  for (const s of trailEl.children) s.classList.remove('got');
  kids.forEach((kid, i) => {
    kid.g.position.set(-3 + i * 2, START.top, START.z + 0.3);
    kid.g.scale.setScalar(kid.k.scale);
    kid.face = kid.g.rotation.y = 0;
    kid.mode = 'idle';
  });
  phase = 'pick';
  promptEl.textContent = '👆';
  speak('pick');
}

const overlay = document.getElementById('overlay');
function showOverlay(msg, button) {
  document.getElementById('msg').textContent = msg;
  document.getElementById('go').textContent = button;
  overlay.hidden = false;
}
document.getElementById('go').onclick = async () => {
  overlay.hidden = true;
  await startAudio();
  newGame();
};

// tap a kid to pick; then tap a pizza (or the party deck) to jump to it
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => {
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  if (phase === 'pick') {
    let o = ray.intersectObjects(kids.map(k => k.g), true)[0]?.object;
    while (o && !o.userData.kid) o = o.parent;
    if (o) pickKid(o.userData.kid);
  } else if (phase === 'play' && !jumping) {
    let o = ray.intersectObjects([...pizzas.map(p => p.g), endDeck, endTop], true)[0]?.object;
    while (o && !o.userData.pad) o = o.parent;
    if (o && o.userData.pad !== on) jumpTo(o.userData.pad);
  }
});
// keyboard: space / up arrow jumps to the next pizza
addEventListener('keydown', e => {
  if (phase !== 'play' || jumping || ![' ', 'ArrowUp', 'w'].includes(e.key)) return;
  const i = on === START ? 0 : pizzas.indexOf(on) + 1;
  jumpTo(pizzas[i] ?? endPad);
});

let dist = 12, tilt = [0.62, 0.78];
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  dist = THREE.MathUtils.clamp(5.4 / (TAN * camera.aspect), 11, 26);  // fit the room's width
  tilt = camera.aspect < 1 ? [0.78, 0.63] : [0.66, 0.75];
}
addEventListener('resize', resize);
resize();

let last = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  for (const tw of tweens.slice()) {
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    tw.fn(tw.t);
    if (tw.t === 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done?.(); }
  }
  lavaTex.offset.set(Math.sin(t / 4000) * 0.1, t / 30000);
  for (const b of bubbles) {  // lava bubbles grow and pop
    b.userData.t += dt * 0.7;
    if (b.userData.t > 1) { b.userData.t = 0; placeBubble(b); }
    b.scale.setScalar(Math.sin(b.userData.t * Math.PI) + 0.01);
  }

  const here = runner ? runner.g.position : null;
  for (const p of pizzas) {
    p.sink = Math.max(0, p.sink - dt * 3);
    p.g.position.set(p.bx + Math.sin(t / 1100 + p.ph) * p.amp, 0.05 + Math.sin(t / 500 + p.ph) * 0.04 - p.sink * 0.08, p.z);
    p.g.rotation.y += dt * 0.15;
    const near = phase === 'play' && p !== on && Math.hypot(p.g.position.x - here.x, p.g.position.z - here.z) <= REACH;
    p.ring.visible = near;
    if (near) p.ring.material.color.setHSL(0.15, 1, 0.6 + 0.3 * Math.sin(t / 120));
  }
  // ride the pizza you're standing on
  if (runner && !jumping && on?.g && phase === 'play') runner.g.position.set(on.g.position.x, on.top + on.g.position.y - 0.05, on.g.position.z);

  for (const kid of kids) {
    const air = kid === runner && jumping;
    kid.legs[0].rotation.x = air ? -0.7 : 0; kid.legs[1].rotation.x = air ? 0.5 : 0;
    if (air || kid.mode !== 'idle') {  // arms up: jumping, cheering or dancing
      const w = Math.sin(t / 140 + kid.k.scale * 5);
      kid.arms[0].rotation.x = -2.6 + w * 0.4; kid.arms[1].rotation.x = -2.6 - w * 0.4;
    } else kid.arms[0].rotation.x = kid.arms[1].rotation.x = 0;
    if (kid.mode !== 'idle' && kid !== runner) kid.g.position.y = END.top + Math.abs(Math.sin(t / 190 + kid.k.scale * 4)) * 0.3;
    if (kid.mode === 'dance') { kid.face += dt * 3; if (kid === runner) kid.g.position.y = END.top + Math.abs(Math.sin(t / 170)) * 0.4; }
    const da = kid.face - kid.g.rotation.y;
    kid.g.rotation.y += Math.atan2(Math.sin(da), Math.cos(da)) * Math.min(1, dt * 12);
  }

  // camera follows the jumper along the room
  const want = THREE.MathUtils.clamp(runner ? runner.g.position.z - 1 : START.z, END.z + 1, START.z - 1.5);
  camZ += (want - camZ) * Math.min(1, dt * 3);
  camera.position.set(0, dist * tilt[0], camZ + dist * tilt[1]);
  camera.lookAt(0, 0, camZ - 1);
  lavaLight.position.set(0, 1.5, camZ - 2);
  sun.position.set(4, 12, camZ + 4); sun.target.position.set(0, 0, camZ);
  renderer.render(scene, camera);
});
newGame();
phase = 'start';
promptEl.textContent = '';
</script>
