<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120a2e; font-family: system-ui, sans-serif; color: #fff;

  canvas { display: block; touch-action: none; }
  .pill { position: fixed; top: 12px; z-index: 2; font-size: min(2.6rem, 8vw); font-weight: 900; background: #ffffff1c;
    border: 3px solid #5ff7ff; border-radius: 1.2rem; padding: .1rem .7rem; box-shadow: 0 0 18px #5ff7ff88; text-decoration: none; }
  #home { left: 12px; }
  #coins { left: 50%; transform: translateX(-50%); border-color: #ffd23f; box-shadow: 0 0 18px #ffd23f88; }
  #timer { right: 12px; border-color: #ff4fd8; box-shadow: 0 0 18px #ff4fd888; }
  #timer.hurry { animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.15); } }
  #coins.pop { animation: pop .25s; }
  @keyframes pop { 50% { transform: translateX(-50%) scale(1.3); } }
  #prompt { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 6rem; font-weight: 900;
    text-shadow: 0 0 24px #ff4fd8, 0 0 8px #5ff7ff; animation: bob 1s ease-in-out infinite; pointer-events: none; }
  @keyframes bob { 50% { transform: translate(-50%, -10px); } }
  #overlay { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; background: #120a2ecc; font-size: 5rem; font-weight: 900; text-align: center; }
  #overlay[hidden] { display: none; }
  #go { font-size: 5rem; background: #ffffff22; border: 4px solid #5ff7ff; border-radius: 2rem; padding: .4rem 2.2rem;
    box-shadow: 0 0 30px #5ff7ff; color: #fff; }
  #go:active { transform: scale(.94); }
  .conf { position: fixed; top: -12vh; z-index: 4; font-size: 2.6rem; pointer-events: none; animation: fall 3.2s linear forwards; }
  @keyframes fall { to { transform: translateY(125vh) rotate(720deg); } }
</style>

<script type="module">
import * as THREE from '../lib/three.module.min.js';

// ---------- sounds, voice & music ----------
let ac, musicOut, voiceSrc;
const voices = {}, MUSIC_VOL = 0.32;
function tone(f, at, dur, type = 'triangle', vol = 0.2, out = ac?.destination) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur);
}
const coinSound = () => { tone(988, 0, 0.08, 'square', 0.08); tone(1319, 0.07, 0.25, 'square', 0.08); };
const beep = (f = 660) => tone(f, 0, 0.25, 'square', 0.1);
const fanfare = () => [523, 659, 784, 1047, 0, 784, 1047].forEach((f, i) => f && tone(f, i * 0.12, 0.4));

// Voice lines are recorded ahead of time (python3 tools/voice.py) and embedded in #voice-data, so they work offline.
function speak(key) {
  const buf = voices[key];
  if (!buf) return;
  voiceSrc?.stop();
  const src = voiceSrc = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
  musicOut.gain.setTargetAtTime(0.08, ac.currentTime, 0.05);  // music dips while the voice talks
  src.onended = () => { if (voiceSrc === src) musicOut.gain.setTargetAtTime(MUSIC_VOL, ac.currentTime, 0.4); };
}

// Original zippy space-arcade tune, loops forever. One melody note per eighth ('-' = rest), one bass note per quarter.
const TUNE = ('E5 G5 A5 - G5 E5 D5 - E5 G5 C6 - B5 A5 G5 - A5 - G5 E5 - D5 E5 - G5 - - - E5 - D5 - ' +
              'E5 G5 A5 - G5 E5 D5 - E5 G5 C6 - D6 C6 A5 - G5 A5 G5 E5 D5 - C5 - C5 E5 G5 - C6 - - -').split(' ');
const BASS = ('A2 E3 A2 E3 C3 G3 C3 G3 F2 C3 F2 C3 G2 D3 G2 D3 ' +
              'A2 E3 A2 E3 C3 G3 C3 G3 F2 C3 G2 D3 C3 G3 C3 -').split(' ');
const freq = n => 440 * 2 ** (({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]] + 12 * (+n[1] + 1) - 69) / 12);
const EIGHTH = 0.13;
let step = 0, nextT = 0;
function music() {
  if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;  // tab was asleep: pick up from now
  while (nextT < ac.currentTime + 0.3) {
    const at = nextT - ac.currentTime, m = TUNE[step % TUNE.length], b = BASS[(step >> 1) % BASS.length];
    if (m !== '-') tone(freq(m), at, EIGHTH * 0.7, 'square', 0.09, musicOut);
    if (step % 2 === 0 && b !== '-') tone(freq(b), at, EIGHTH * 1.6, 'triangle', 0.3, musicOut);
    step++;
    nextT += EIGHTH;
  }
}
async function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();  // must be created inside the tap (iOS)
  musicOut = ac.createGain();
  musicOut.gain.value = MUSIC_VOL;
  musicOut.connect(ac.destination);
  await Promise.all(Object.entries(window.VOICE ?? {}).map(async ([k, b64]) =>
    voices[k] = await ac.decodeAudioData(Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer)));
  setInterval(music, 100);
}

// ---------- scene helpers ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#120a2e');
scene.fog = new THREE.Fog('#120a2e', 22, 60);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const TAN = Math.tan(THREE.MathUtils.degToRad(20));

scene.add(new THREE.HemisphereLight('#b9a8ff', '#2a1050', 1.6));
const moon = new THREE.DirectionalLight('#e6e0ff', 1.8);
moon.position.set(-3, 10, 6);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });
moon.shadow.camera.updateProjectionMatrix();
scene.add(moon);

const mats = {};
const mat = c => mats[c] ??= new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
const glowMat = c => new THREE.MeshBasicMaterial({ color: c });
function add(geo, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(geo, typeof color === 'string' ? mat(color) : color);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d, c, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), c, x, y, z, p);
const cyl = (r, h, c, x, y, z, p, r2 = r) => add(new THREE.CylinderGeometry(r, r2, h, 28), c, x, y, z, p);
const ball = (r, c, x, y, z, p) => add(new THREE.SphereGeometry(r, 24, 16), c, x, y, z, p);
const capsule = (r, len, c, x, y, z, p) => add(new THREE.CapsuleGeometry(r, len, 4, 12), c, x, y, z, p);
const cap = (r, c, p) => add(new THREE.SphereGeometry(r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), c, 0, 0.02, -0.02, p);
function group(x, z, rotY = 0, y = 0, parent = scene) {
  const g = new THREE.Group();
  g.position.set(x, y, z); g.rotation.y = rotY;
  parent.add(g);
  return g;
}

// ---------- the space arena ----------
const W = 13, D = 8;  // arena floor size
box(W, 0.2, D, '#2a1b5e', 0, -0.1, 0);
const grid = new THREE.GridHelper(W, 26, '#ff4fd8', '#6a4fe0');
grid.scale.z = D / W; grid.position.y = 0.01;
scene.add(grid);
for (const [w, d, x, z] of [[W + 0.3, 0.15, 0, D / 2], [W + 0.3, 0.15, 0, -D / 2], [0.15, D, W / 2, 0], [0.15, D, -W / 2, 0]])
  add(new THREE.BoxGeometry(w, 0.2, d), glowMat('#5ff7ff'), x, 0.1, z);  // neon edge
// cheering stand behind the arena, with glowing bulbs
box(W - 3, 0.35, 1.6, '#3b2780', 0, 0.17, -D / 2 - 1);
for (let i = 0; i < 12; i++) add(new THREE.SphereGeometry(0.09, 12, 8), glowMat(i % 2 ? '#ff4fd8' : '#ffd23f'), -4.6 + i * 0.84, 0.4, -D / 2 - 0.25);
// planets
const planets = [
  [-10, 3, -16, 2.6, '#ff8a5c', true], [12, 5, -20, 3.4, '#5ff7ff', false], [4, 8, -26, 1.6, '#c58bff', true], [-3, 9, -30, 1.1, '#9dff8a', false],
].map(([x, y, z, r, c, ring]) => {
  const p = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.35 }));
  p.position.set(x, y, z);
  if (ring) { const rg = new THREE.Mesh(new THREE.TorusGeometry(r * 1.6, r * 0.12, 8, 48), glowMat('#ffe9a8')); rg.rotation.x = 1.25; p.add(rg); }
  scene.add(p);
  return p;
});
// stars
const starPos = [];
for (let i = 0; i < 700; i++) {
  const a = Math.random() * Math.PI * 2, e = Math.random() * 1.3 - 0.15, r = 70;
  starPos.push(Math.sin(a) * Math.cos(e) * r, Math.sin(e) * r, Math.cos(a) * Math.cos(e) * r);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: '#ffffff', size: 0.35, fog: false }));
scene.add(stars);

// ---------- the four kids ----------
// Cartoon look-alikes of the family's kids (hair, shirts, sizes). The photos themselves stay local and are never used here.
const KIDS = [
  { scale: 1.12, skin: '#f3cdb0', hair: '#7a5232', style: 'long', shirt: '#fafafa', pants: '#b8bcc2', chest: 'bow' },
  { scale: 1.0, skin: '#f6d3b8', hair: '#8a6a48', style: 'swept', shirt: '#fafafa', pants: '#b0b6bd', chest: 'dots', tongue: true },
  { scale: 0.96, skin: '#f3c9a8', hair: '#2b1b12', style: 'shaggy', shirt: '#2f45c8', pants: '#9ea4ab' },
  { scale: 0.78, skin: '#f0c49e', hair: '#9a6a40', style: 'baby', shirt: '#f07a6a', pants: '#f07a6a' },
];
function hair(head, style, c) {
  if (style === 'long') {        // long hair pulled half-up, strands by the face
    cap(0.32, c, head).rotation.x = -0.3;
    box(0.56, 0.6, 0.14, c, 0, -0.22, -0.22, head);
    ball(0.13, c, 0, 0.12, -0.36, head);
    capsule(0.08, 0.3, c, 0, -0.15, -0.42, head);
    for (const s of [-1, 1]) capsule(0.07, 0.3, c, 0.27 * s, -0.12, 0.06, head);
  } else if (style === 'swept') { // short, fringe swept to the side
    cap(0.32, c, head).rotation.x = -0.35;
    for (const [x, y] of [[-0.17, 0.17], [-0.04, 0.21], [0.1, 0.2]]) ball(0.1, c, x, y, 0.19, head);
  } else if (style === 'shaggy') { // dark, shaggy bangs
    cap(0.33, c, head).rotation.x = -0.3;
    for (const [x, y] of [[-0.16, 0.17], [-0.05, 0.2], [0.07, 0.2], [0.17, 0.16]]) ball(0.1, c, x, y, 0.2, head);
    ball(0.08, c, 0.04, 0.33, -0.02, head);
  } else {                         // toddler: short and soft
    cap(0.31, c, head).rotation.x = -0.45;
    ball(0.06, c, 0.05, 0.31, 0.05, head);
  }
}
const POM = ['#ff4fd8', '#5ff7ff', '#ffd23f', '#9dff8a'];
function makeKid(k, i) {
  const g = group(0, 0);
  g.scale.setScalar(k.scale);
  const legs = [-1, 1].map(s => {
    const hip = group(0.1 * s, 0, 0, 0.45, g);
    capsule(0.085, 0.25, k.pants, 0, -0.2, 0, hip);
    box(0.15, 0.08, 0.24, '#ffffff', 0, -0.41, 0.04, hip);
    return hip;
  });
  capsule(0.2, 0.2, k.shirt, 0, 0.72, 0, g);
  if (k.chest === 'bow') { for (const s of [-1, 1]) ball(0.06, '#e53935', 0.06 * s, 0.82, 0.19, g); ball(0.035, '#e53935', 0, 0.82, 0.21, g); }
  if (k.chest === 'dots') for (const [x, y] of [[-0.1, 0.85], [0.08, 0.78], [-0.05, 0.65], [0.11, 0.6]]) ball(0.035, '#ffd600', x, y, 0.19, g);
  const poms = [];
  const arms = [-1, 1].map(s => {
    const sh = group(0.26 * s, 0, 0, 0.92, g);
    capsule(0.065, 0.25, k.shirt, 0, -0.17, 0, sh);
    ball(0.07, k.skin, 0, -0.36, 0, sh);
    poms.push(add(new THREE.IcosahedronGeometry(0.15, 1), glowMat(POM[i]), 0, -0.42, 0, sh));  // cheer pom-poms
    return sh;
  });
  const head = group(0, 0, 0, 1.25, g);
  ball(0.3, k.skin, 0, 0, 0, head);
  hair(head, k.style, k.hair);
  for (const s of [-1, 1]) {
    ball(0.06, '#ffffff', 0.1 * s, 0.02, 0.285, head);
    ball(0.035, '#3b2415', 0.1 * s, 0.02, 0.33, head);
    ball(0.05, '#ff9e9e', 0.18 * s, -0.08, 0.23, head).scale.z = 0.4;
    ball(0.07, k.skin, 0.3 * s, 0, 0, head);
  }
  ball(0.035, k.skin, 0, -0.03, 0.3, head);
  add(new THREE.TorusGeometry(0.08, 0.018, 8, 16, Math.PI), '#8a3030', 0, -0.1, 0.26, head).rotation.z = Math.PI;
  if (k.tongue) ball(0.045, '#ff7b9c', 0.03, -0.15, 0.25, head);
  const ring = add(new THREE.TorusGeometry(0.45, 0.04, 8, 40), glowMat('#5ff7ff'), 0, 0.03, 0, g);  // "that's you" ring
  ring.rotation.x = Math.PI / 2;

  const kid = { k, g, legs, arms, poms, ring, baseY: 0, target: null, arrive: null, speed: 2.5, face: 0, phase: 0, jumpY: 0, mode: 'idle' };
  g.userData.kid = kid;
  return kid;
}
const kids = KIDS.map(makeKid);
const walk = (kid, x, z, arrive = null) => { kid.target = new THREE.Vector3(x, 0, z); kid.arrive = arrive; };

// ---------- coins ----------
const coinGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.08, 32);
const coinMat = new THREE.MeshStandardMaterial({ color: '#ffd23f', emissive: '#ffb000', emissiveIntensity: 0.6, metalness: 0.4, roughness: 0.3 });
const COUNT = 10;
const coins = Array.from({ length: COUNT }, () => {
  const c = new THREE.Mesh(coinGeo, coinMat);
  c.rotation.x = Math.PI / 2;
  c.castShadow = true;
  const holder = group(0, 0, 0, 0.6);
  holder.add(c);
  holder.visible = false;
  return { g: holder, live: false, spin: Math.random() * 6 };
});
function placeCoin(c) {
  const p = runner?.g.position;
  let x, z;
  do { x = (Math.random() - 0.5) * (W - 1.6); z = (Math.random() - 0.5) * (D - 1.4); }
  while ((p && Math.hypot(x - p.x, z - p.z) < 2) || coins.some(o => o !== c && o.live && Math.hypot(x - o.g.position.x, z - o.g.position.z) < 1.2));
  c.g.position.set(x, 0.6, z);
  c.g.scale.setScalar(0.001);
  c.g.visible = c.live = true;
  tween(0.3, k => c.g.scale.setScalar(easeOut(k) + 0.001));
}

// ---------- game ----------
const tweens = [];
const tween = (dur, fn, done) => tweens.push({ t: 0, dur, fn, done });
const easeOut = k => 1 - (1 - k) ** 3;
const jump = kid => tween(0.45, k => kid.jumpY = Math.sin(k * Math.PI) * 0.5);
const clamp = THREE.MathUtils.clamp;
const TIME = 30;
let phase = 'start', score = 0, timeLeft = TIME, runner = null, cheerIn = 4, best = +localStorage.coinDashBest || 0;
const promptEl = document.getElementById('prompt'), coinsEl = document.getElementById('coins'), timerEl = document.getElementById('timer');
const STAND = [-3, 0, 3];  // spots on the cheering stand

function grab(c) {
  c.live = false;
  score++;
  coinSound();
  coinsEl.textContent = '🪙 ' + score;
  coinsEl.classList.remove('pop'); void coinsEl.offsetWidth; coinsEl.classList.add('pop');
  const y0 = c.g.position.y;
  tween(0.35, k => { c.g.position.y = y0 + k * 1.5; c.g.scale.setScalar(1 - k + 0.001); }, () => {
    c.g.visible = false;
    if (phase === 'play') setTimeout(() => phase === 'play' && placeCoin(c), 400);
  });
  if (score % 5 === 0) for (const kid of kids) if (kid !== runner) jump(kid);  // the crowd goes wild
}

function pickKid(kid) {
  phase = 'ready';
  runner = kid;
  runner.speed = 4.6;
  runner.ring.visible = true;
  jump(kid); beep(880);
  promptEl.textContent = '';
  walk(runner, 0, 1.2);
  kids.filter(k => k !== kid).sort((a, b) => a.g.position.x - b.g.position.x).forEach((k, i) => {
    k.speed = 3.5;
    walk(k, STAND[i], -D / 2 - 1, () => { k.baseY = 0.35; k.mode = 'cheer'; k.face = 0; });
  });
  // 3, 2, 1, go!
  [3, 2, 1].forEach((n, i) => setTimeout(() => { promptEl.textContent = n; beep(); }, 1200 + i * 800));
  setTimeout(() => {
    promptEl.textContent = 'GO!';
    beep(1320);
    speak('go');
    phase = 'play';
    for (const c of coins) placeCoin(c);
    setTimeout(() => promptEl.textContent === 'GO!' && (promptEl.textContent = ''), 900);
  }, 1200 + 3 * 800);
}

function timeUp() {
  phase = 'done';
  runner.target = null;
  for (const c of coins) { c.live = false; c.g.visible = false; }
  timerEl.classList.remove('hurry');
  fanfare();
  const record = score > best;
  if (record) localStorage.coinDashBest = best = score;
  speak('end');
  if (record) setTimeout(() => speak('best'), (voices.end?.duration ?? 2.5) * 1000 + 300);
  for (const kid of kids) { kid.mode = 'dance'; kid.target = null; }
  const fun = ['🪙', '⭐', '🎉', '✨', '🌟'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.textContent = fun[i % fun.length];
    d.style.left = Math.random() * 95 + 'vw';
    d.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.append(d);
    setTimeout(() => d.remove(), 5000);
  }
  setTimeout(() => showOverlay(`🪙 ${score} 🎉<br><span style="font-size:3rem">🏆 ${best}</span>`, '🔄'), 4500);
}

function newGame() {
  score = 0; timeLeft = TIME; runner = null; cheerIn = 4;
  coinsEl.textContent = '🪙 0';
  timerEl.textContent = '⏱️ ' + TIME;
  for (const c of coins) { c.live = false; c.g.visible = false; }
  kids.forEach((kid, i) => {
    kid.g.position.set(-3.3 + i * 2.2, 0, 1);
    kid.g.rotation.y = kid.face = 0;
    kid.target = null; kid.baseY = 0; kid.jumpY = 0; kid.mode = 'idle';
    kid.ring.visible = false;
  });
  phase = 'pick';
  promptEl.textContent = '👆';
  speak('pick');
}

const overlay = document.getElementById('overlay');
function showOverlay(msg, button) {
  document.getElementById('msg').innerHTML = msg;
  document.getElementById('go').textContent = button;
  overlay.hidden = false;
}
document.getElementById('go').onclick = async () => {
  overlay.hidden = true;
  await startAudio();
  newGame();
};

// controls: tap a kid to pick; then touch/drag (or click) where to run, or use the arrow keys / WASD
const ray = new THREE.Raycaster(), floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
let held = false;
function aim(e) {
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  return ray;
}
function steer(e) {
  if (phase !== 'play' || !aim(e).ray.intersectPlane(floor, hit)) return;
  walk(runner, clamp(hit.x, -W / 2 + 0.4, W / 2 - 0.4), clamp(hit.z, -D / 2 + 0.4, D / 2 - 0.4));
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  held = true;
  if (phase === 'pick') {
    let o = aim(e).intersectObjects(kids.map(k => k.g), true)[0]?.object;
    while (o && !o.userData.kid) o = o.parent;
    if (o) pickKid(o.userData.kid);
  } else steer(e);
});
cv.addEventListener('pointermove', e => held && steer(e));
addEventListener('pointerup', () => held = false);
addEventListener('pointercancel', () => held = false);
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let dist = 12, tilt = [0.62, 0.78];
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  dist = clamp(7.6 / (TAN * camera.aspect), 13, 30);  // always fit the whole arena
  tilt = camera.aspect < 1 ? [0.7, 0.71] : [0.5, 0.87];
  camera.position.set(0, dist * tilt[0], 0.3 + dist * tilt[1]);
  camera.lookAt(0, 0, -1.2);
}
addEventListener('resize', resize);
resize();

let last = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  for (const tw of tweens.slice()) {
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    tw.fn(tw.t);
    if (tw.t === 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done?.(); }
  }
  stars.rotation.y += dt * 0.01;
  planets.forEach((p, i) => p.rotation.y += dt * (0.2 + i * 0.1));

  if (phase === 'play') {
    const prev = Math.ceil(timeLeft);
    timeLeft = Math.max(0, timeLeft - dt);
    const sec = Math.ceil(timeLeft);
    if (sec !== prev) {
      timerEl.textContent = '⏱️ ' + sec;
      if (sec === 10) { speak('ten'); timerEl.classList.add('hurry'); }
      if (sec <= 5 && sec > 0) beep(sec === 1 ? 990 : 770);
    }
    if ((cheerIn -= dt) <= 0 && (timeLeft > 12 || (timeLeft < 9 && timeLeft > 3))) {
      speak('cheer' + (1 + Math.random() * 4 | 0));
      cheerIn = 6 + Math.random() * 3;
    }
    // arrow keys / WASD
    const kx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    const kz = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
    if (kx || kz) {
      const p = runner.g.position;
      walk(runner, clamp(p.x + kx, -W / 2 + 0.4, W / 2 - 0.4), clamp(p.z + kz, -D / 2 + 0.4, D / 2 - 0.4));
    }
    for (const c of coins) if (c.live && Math.hypot(c.g.position.x - runner.g.position.x, c.g.position.z - runner.g.position.z) < 0.75) grab(c);
    if (timeLeft === 0) timeUp();
  }
  for (const c of coins) if (c.live) {
    c.g.rotation.y = t / 300 + c.spin;
    c.g.position.y = 0.6 + Math.sin(t / 250 + c.spin) * 0.1;
  }

  for (const kid of kids) {
    const p = kid.g.position;
    let moving = false;
    if (kid.target) {
      const dx = kid.target.x - p.x, dz = kid.target.z - p.z, d = Math.hypot(dx, dz);
      if (d < 0.05) {
        const arrive = kid.arrive;
        kid.target = kid.arrive = null;
        if (kid !== runner) kid.face = 0;
        arrive?.();
      } else {
        const s = Math.min(d, kid.speed * dt);
        p.x += dx / d * s;
        p.z += dz / d * s;
        kid.face = Math.atan2(dx, dz);
        moving = true;
      }
    }
    kid.phase = moving ? kid.phase + dt * 13 : 0;
    const swing = Math.sin(kid.phase) * 0.7;
    kid.legs[0].rotation.x = swing; kid.legs[1].rotation.x = -swing;
    const party = kid.mode === 'cheer' || kid.mode === 'dance';
    for (const pm of kid.poms) pm.visible = party;
    if (party) {  // arms up, waving pom-poms, hopping
      const w = Math.sin(t / 140 + kid.k.scale * 5);
      kid.arms[0].rotation.x = -2.6 + w * 0.4; kid.arms[1].rotation.x = -2.6 - w * 0.4;
      kid.arms[0].rotation.z = -0.3; kid.arms[1].rotation.z = 0.3;
      kid.jumpY = Math.max(kid.jumpY * 0.9, Math.abs(Math.sin(t / 190 + kid.k.scale * 4)) * 0.25);
      if (kid.mode === 'dance') kid.face += dt * 3;
    } else {
      kid.arms[0].rotation.x = -swing; kid.arms[1].rotation.x = swing;
      kid.arms[0].rotation.z = kid.arms[1].rotation.z = 0;
    }
    kid.ring.material.color.setHSL((t / 2000) % 1, 1, 0.6);
    p.y = kid.baseY + kid.jumpY + (moving ? Math.abs(Math.sin(kid.phase)) * 0.07 : 0);
    const da = kid.face - kid.g.rotation.y;
    kid.g.rotation.y += Math.atan2(Math.sin(da), Math.cos(da)) * Math.min(1, dt * 12);
  }
  renderer.render(scene, camera);
});
newGame();
phase = 'start';
promptEl.textContent = '';
</script>
</body>
</html>
