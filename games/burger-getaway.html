<title>Burger Getaway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7ec8ff; font-family: system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  .hud { position: fixed; z-index: 2; background: #fff; border: 4px solid #222; border-radius: 1rem; box-shadow: 4px 4px 0 #222;
    font-size: min(2.2rem, 7vw); font-weight: 900; text-decoration: none; color: #222; padding: .1rem .5rem; }
  #home { top: 12px; left: 12px; }
  #burgers { top: 12px; right: 12px; }
  #road { top: 12px; left: 50%; transform: translateX(-50%); width: min(44vw, 420px); height: 2.4rem; padding: 0; overflow: hidden;
    background: repeating-linear-gradient(90deg, #555 0 14px, #ffd600 14px 22px) center / 100% 4px no-repeat, #ddd; }
  #road span { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; transition: left .2s linear; }
  #me { left: 0%; } #cops { left: 0%; } #goal { left: 94%; }
  .arrow { bottom: 18px; font-size: 3rem; padding: .2rem 1rem; pointer-events: none; opacity: .85; }
  #left { left: 18px; } #right { right: 18px; }
  .arrow[hidden] { display: none; }
  #prompt { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 5.5rem; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px #222; pointer-events: none; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -10px); } }
  #overlay { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; background: #0006; font-size: 6rem; text-align: center; }
  #overlay[hidden] { display: none; }
  #go { font-size: 5rem; background: #ffd600; border: 5px solid #222; border-radius: 2rem; padding: .4rem 2.2rem; box-shadow: 6px 6px 0 #222; }
  #go:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #222; }
  .conf { position: fixed; top: -12vh; z-index: 4; font-size: 2.6rem; pointer-events: none; animation: fall 3.2s linear forwards; }
  @keyframes fall { to { transform: translateY(125vh) rotate(720deg); } }
</style>

<script type="module">
import * as THREE from '../lib/three.module.min.js';

// ---------- sounds, voice & music ----------
let ac, musicOut, voiceSrc;
const voices = {}, MUSIC_VOL = 0.3;
function tone(f, at, dur, type = 'triangle', vol = 0.2, out = ac?.destination) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur);
}
const chomp = () => { tone(660, 0, 0.08, 'square', 0.08); tone(990, 0.08, 0.15, 'square', 0.08); };
const bonk = () => { tone(120, 0, 0.3, 'sawtooth', 0.15); tone(80, 0.05, 0.35, 'square', 0.1); };
const swish = () => tone(500, 0, 0.1, 'sine', 0.1);
const beep = (f = 660) => tone(f, 0, 0.25, 'square', 0.1);
const poof = () => tone(300, 0, 0.2, 'sine', 0.2);
const fanfare = () => [523, 659, 784, 1047, 0, 784, 1047].forEach((f, i) => f && tone(f, i * 0.12, 0.4));

// Voice lines are recorded ahead of time (python3 tools/voice.py) and embedded in #voice-data, so they work offline.
function speak(key) {
  const buf = voices[key];
  if (!buf) return;
  voiceSrc?.stop();
  const src = voiceSrc = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();

// Original sneaky car-chase tune, loops forever; a little wee-woo siren joins in while racing.
const TUNE = ('E5 - E5 G5 - E5 D5 - C5 - D5 E5 - - B4 - E5 - E5 G5 - A5 G5 - E5 - D5 C5 D5 - - - ' +
              'A5 - A5 G5 - E5 G5 - A5 - C6 B5 - A5 G5 - E5 - G5 E5 D5 - C5 - D5 - E5 - - - - -').split(' ');
const BASS = ('A2 A3 A2 A3 F2 F3 G2 G3 A2 A3 A2 A3 F2 F3 E2 E3 ' +
              'D3 D2 D3 D2 A2 A3 A2 A3 F2 F3 G2 G3 A2 E3 A2 -').split(' ');
const freq = n => 440 * 2 ** (({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]] + 12 * (+n[1] + 1) - 69) / 12);
const EIGHTH = 0.12;
let step = 0, nextT = 0;
function music() {
  if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;  // tab was asleep: pick up from now
  while (nextT < ac.currentTime + 0.3) {
    const at = nextT - ac.currentTime, m = TUNE[step % TUNE.length], b = BASS[(step >> 1) % BASS.length];
    if (m !== '-') tone(freq(m), at, EIGHTH * 0.7, 'square', 0.08, musicOut);
    if (step % 2 === 0 && b !== '-') tone(freq(b), at, EIGHTH * 1.6, 'triangle', 0.3, musicOut);
    if (phase === 'race' && step % 4 === 0) tone(step % 8 ? 760 : 960, at, EIGHTH * 3.5, 'sine', 0.035 + 0.05 * (1 - (gap - CATCH) / (FAR - CATCH)), musicOut);
    step++;
    nextT += EIGHTH;
  }
}
async function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();  // must be created inside the tap (iOS)
  musicOut = ac.createGain();
  musicOut.gain.value = MUSIC_VOL;
  musicOut.connect(ac.destination);
  await Promise.all(Object.entries(window.VOICE ?? {}).map(async ([k, b64]) =>
    voices[k] = await ac.decodeAudioData(Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer)));
  setInterval(music, 100);
}

// ---------- game ----------
const tweens = [];
const tween = (dur, fn, done) => tweens.push({ t: 0, dur, fn, done });
const easeOut = k => 1 - (1 - k) ** 3;
const clamp = THREE.MathUtils.clamp;
const GOAL = 800, FAR = 7, CATCH = 3.8;  // metres to the hideout; police distance
let phase = 'start', lane = 1, travelled = 0, speed = 0, gap = FAR, nextRow = 30, eaten = 0, safeFor = 0, said = {};
const promptEl = document.getElementById('prompt'), burgersEl = document.getElementById('burgers');
const meEl = document.getElementById('me'), copsEl = document.getElementById('cops');
const arrows = [document.getElementById('left'), document.getElementById('right')];
const byRole = r => kids.filter(k => k.role === r);

function hopInto(kid, c, seat) {  // jump in an arc into a car seat
  const from = kid.g.position.clone(), to = new THREE.Vector3(...c.seats[seat]);
  c.g.localToWorld(to);
  kid.face = Math.PI;
  poof();
  tween(0.6, k => {
    kid.g.position.lerpVectors(from, to, k);
    kid.g.position.y += Math.sin(k * Math.PI) * 1.5;
  }, () => { c.g.attach(kid.g); kid.g.position.set(...c.seats[seat]); kid.baseY = c.seats[seat][1]; });
}

function pickKid(kid) {
  if (kid.role) return;
  setRole(kid, 'thief');
  const n = byRole('thief').length;
  hopInto(kid, getaway, n - 1);
  if (n === 1) { speak('pick2'); return; }
  phase = 'ready';
  promptEl.textContent = '';
  kids.filter(k => !k.role).forEach((k, i) => { setRole(k, 'cop'); setTimeout(() => hopInto(k, cops, i), 500 + i * 300); });
  speak('intro');
  const wait = Math.max(3, (voices.intro?.duration ?? 6) - 1) * 1000;
  [3, 2, 1].forEach((n, i) => setTimeout(() => { promptEl.textContent = n; beep(); }, wait + i * 800));
  setTimeout(() => {
    promptEl.textContent = 'GO!';
    beep(1320);
    phase = 'race';
    arrows.forEach(a => a.hidden = false);
    setTimeout(() => promptEl.textContent === 'GO!' && (promptEl.textContent = ''), 900);
  }, wait + 3 * 800);
}

function steer(dir) {
  if (phase !== 'race') return;
  const to = clamp(lane + dir, 0, 2);
  if (to !== lane) { lane = to; swish(); }
}

function bump(t) {
  t.hit = true;
  bonk();
  safeFor = 1.2;
  gap = Math.max(CATCH - 0.1, gap - 1.1);
  speed *= 0.5;
  const g = t.g, spin = (Math.random() < 0.5 ? -1 : 1);
  tween(0.6, k => { g.position.y = Math.sin(k * Math.PI) * 2; g.position.x += spin * 0.15; g.rotation.z = spin * k * 4; });
  tween(0.6, k => getaway.g.rotation.y = Math.sin(k * Math.PI * 4) * 0.25 * (1 - k));
  if (gap > CATCH) speak(gap < 5 ? 'bump1' : 'bump2');
}

function eat(t) {
  t.hit = true;
  chomp();
  eaten++;
  burgersEl.textContent = '🍔 ' + eaten;
  gap = Math.min(FAR, gap + 0.8);  // burger power: zoom away a bit
  if (eaten % 4 === 1) speak('yum');
  const thief = byRole('thief')[eaten % 2];
  const g = t.g, from = g.position.clone(), to = new THREE.Vector3();
  tween(0.35, k => {
    thief.head.getWorldPosition(to);
    g.position.lerpVectors(from, to, k);
    g.scale.setScalar(1 - k * 0.8);
  }, () => g.visible = false);
}

function caught() {
  phase = 'caught';
  arrows.forEach(a => a.hidden = true);
  bonk();
  speak('caught');
  setTimeout(() => showOverlay('🚓🍔😋', '🔄'), (voices.caught?.duration ?? 4) * 1000 + 300);
}

function win() {
  phase = 'done';
  arrows.forEach(a => a.hidden = true);
  fanfare();
  setTimeout(() => speak('win'), 1000);
  setTimeout(() => {  // everyone hops out and has a burger party
    kids.forEach((kid, i) => {
      scene.attach(kid.g);
      kid.g.position.set(-3 + i * 2, 0, -4);
      kid.baseY = 0;
      kid.face = 0;
      kid.dance = true;
      poof();
      if (!kid.party) { kid.party = burger(kid.arms[1], 0.35); kid.party.position.set(0, -0.5, 0.1); }
      kid.party.visible = true;
    });
  }, 1800);
  const fun = ['🍔', '🎉', '⭐', '🍟', '✨'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.textContent = fun[i % fun.length];
    d.style.left = Math.random() * 95 + 'vw';
    d.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.append(d);
    setTimeout(() => d.remove(), 5000);
  }
  setTimeout(() => showOverlay('🍔🎉', '🔄'), 8500);
}

function newGame() {
  for (const t of things) scene.remove(t.g);
  things.length = 0;
  lane = 1; travelled = 0; speed = 0; gap = FAR; nextRow = 30; eaten = 0; safeFor = 0; said = {};
  burgersEl.textContent = '🍔 0';
  hideout.position.z = -200; stand.position.z = -8;
  getaway.g.position.set(0, 0, 0); getaway.g.rotation.set(0, 0, 0);
  cops.g.position.set(0, 0, FAR);
  kids.forEach((kid, i) => {
    scene.attach(kid.g);
    setRole(kid, null);
    kid.g.position.set(-3 + i * 2, 0, -4.5);
    kid.g.rotation.set(0, 0, 0);
    kid.face = 0; kid.baseY = 0; kid.dance = false;
    if (kid.party) kid.party.visible = false;
  });
  phase = 'pick';
  promptEl.textContent = '👆';
  speak('pick');
}

const overlay = document.getElementById('overlay');
function showOverlay(msg, button) {
  document.getElementById('msg').textContent = msg;
  document.getElementById('go').textContent = button;
  overlay.hidden = false;
}
document.getElementById('go').onclick = async () => {
  overlay.hidden = true;
  await startAudio();
  newGame();
};

// controls: tap kids to pick thieves; then tap the left / right half of the screen (or arrow keys) to change lanes
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => {
  if (phase === 'race') return steer(e.clientX < innerWidth / 2 ? -1 : 1);
  if (phase !== 'pick') return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  let o = ray.intersectObjects(kids.filter(k => !k.role).map(k => k.g), true)[0]?.object;
  while (o && !o.userData.kid) o = o.parent;
  if (o) pickKid(o.userData.kid);
});
addEventListener('keydown', e => {
  if (['ArrowLeft', 'a'].includes(e.key)) steer(-1);
  if (['ArrowRight', 'd'].includes(e.key)) steer(1);
});

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  const dist = clamp(5.2 / (TAN * camera.aspect), 13, 30);  // fit the road's width
  camera.position.set(0, dist * 0.6, 5 + dist * 0.75);
  camera.lookAt(0, 0, -2);
}
addEventListener('resize', resize);
resize();

let last = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  for (const tw of tweens.slice()) {
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    tw.fn(tw.t);
    if (tw.t === 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done?.(); }
  }

  if (phase === 'race') {
    speed = Math.min(16 + travelled / 80, speed + dt * 10);
    travelled += speed * dt;
    gap = Math.min(FAR, gap + dt * 0.3);  // slowly pull away again
    safeFor -= dt;
    // new row of things on the road: 1-2 blocked lanes (never all 3), maybe a burger
    if (travelled >= nextRow && GOAL - travelled > 75) {
      const free = Math.random() * 3 | 0;
      const blocked = [0, 1, 2].filter(l => l !== free).sort(() => Math.random() - 0.5).slice(0, travelled > 250 && Math.random() < 0.5 ? 2 : 1);
      blocked.forEach(l => spawn('block', l, -70));
      if (Math.random() < 0.75) spawn('burger', [0, 1, 2].find(l => !blocked.includes(l) && Math.random() < 0.6) ?? free, -70 - (Math.random() < 0.5 ? 0 : 8));
      nextRow = travelled + Math.max(13, 22 - travelled / 50);
    }
    if (GOAL - travelled < 75 && !said.hideout) { said.hideout = true; hideout.position.z = -(GOAL - travelled) - 25; }
    if (travelled > GOAL / 2 && !said.half) { said.half = true; speak('half'); }
    if (gap <= CATCH) caught();
    if (travelled >= GOAL) win();
  } else speed = Math.max(0, speed - dt * 20);

  const move = speed * dt;
  roadTex.offset.y += move / 8;
  for (const g of scenery) { g.position.z += move; if (g.position.z > 20) g.position.z -= SCENE_LEN; }
  stand.position.z += move;
  hideout.position.z += move;
  for (const th of things.slice()) {
    th.g.position.z += move;
    if (th.kind === 'burger' && !th.hit) th.g.rotation.y += dt * 3;
    if (!th.hit && Math.abs(th.g.position.z) < 1.6 && Math.abs(th.g.position.x - getaway.g.position.x) < 1.4) {
      if (th.kind === 'burger') eat(th);
      else if (safeFor <= 0 && phase === 'race') bump(th);
    }
    if (th.g.position.z > 25) { scene.remove(th.g); things.splice(things.indexOf(th), 1); }
  }

  // getaway car glides between lanes; the police car follows behind
  const gx = getaway.g.position;
  const dx = LANES[lane] - gx.x;
  gx.x += dx * Math.min(1, dt * 9);
  getaway.g.rotation.z = -dx * 0.06;
  if (phase === 'done') gx.z = Math.max(-30, gx.z - dt * 12);  // zoom off to the hideout
  const cp = cops.g.position;
  cp.x += (gx.x - cp.x) * Math.min(1, dt * 2.5);
  if (phase !== 'done') cp.z += (gx.z + (phase === 'caught' ? CATCH : gap) - cp.z) * Math.min(1, dt * 3);
  for (const c of [getaway, cops]) for (const w of c.wheels) w.rotation.x -= move / 0.36;
  const flash = phase === 'race' || phase === 'caught' ? (t / 250 | 0) % 2 : -1;
  redL.visible = flash !== 1; blueL.visible = flash !== 0;

  for (const kid of kids) {
    const inCar = kid.g.parent !== scene;
    kid.legs[0].rotation.x = kid.legs[1].rotation.x = inCar ? -1.4 : 0;  // sitting
    if (kid.dance) {
      kid.g.position.y = Math.abs(Math.sin(t / 180 + kid.k.scale * 4)) * 0.4;
      kid.face += dt * 3;
      kid.arms[0].rotation.x = -2.6 + Math.sin(t / 140) * 0.4; kid.arms[1].rotation.x = -1.6;
    } else if (inCar && phase === 'race' && kid.role === 'thief') {
      kid.arms[0].rotation.x = kid.arms[1].rotation.x = -2.8 + Math.sin(t / 150 + kid.k.scale * 5) * 0.3;  // wheee!
      kid.head.rotation.y = Math.sin(t / 900 + kid.k.scale * 3) > 0.6 ? 2.6 : 0;  // peek back at the police
    } else if (inCar && kid.role === 'cop') {
      kid.arms[0].rotation.x = -1.3; kid.arms[1].rotation.x = -1.3 + (phase === 'race' ? Math.sin(t / 120) * 0.6 : 0);  // steering & waving
      kid.head.rotation.y = 0;
    } else {
      kid.arms[0].rotation.x = kid.arms[1].rotation.x = 0;
      kid.head.rotation.y = 0;
    }
    const da = kid.face - kid.g.rotation.y;
    kid.g.rotation.y += Math.atan2(Math.sin(da), Math.cos(da)) * Math.min(1, dt * 12);
  }

  // top bar: how close are the police, how far to the hideout
  const prog = Math.min(1, travelled / GOAL);
  meEl.style.left = 6 + prog * 82 + '%';
  copsEl.style.left = Math.max(2, 6 + prog * 82 - 4 - (gap - CATCH) * 5) + '%';
  renderer.render(scene, camera);
});
newGame();
phase = 'start';
promptEl.textContent = '';
</script>
</body>
</html>
